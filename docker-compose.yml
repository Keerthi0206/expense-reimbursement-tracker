# Run: docker compose up --build
# Uses SQLite by default to keep this simple (no separate db container).
# For Postgres parity, swap DATABASE_URL below and add a db service.
#
# backend/.env (create it from backend/.env.example) supplies anything not
# explicitly listed under `environment:` below -- e.g. reminder thresholds
# or the second-approval amount. The hardcoded values under `environment:`
# always win over env_file for the same key, so those stay as safe defaults
# regardless of what's in .env.

services:
  backend:
    build: ./backend
    env_file:
      - path: backend/.env
        required: false
    environment:
      DATABASE_URL: sqlite:////app/data/expense_tracker.db
      SECRET_KEY: dev-secret-change-me-in-production
      ALLOWED_ORIGINS: http://localhost:3000
      UPLOAD_DIR: /app/uploads/receipts
    volumes:
      - backend_data:/app/data
      - backend_uploads:/app/uploads
    ports:
      - "8000:8000"
    # seed.py is a no-op if data exists, so restarts are safe
    command: sh -c "python seed.py; uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./src/frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  backend_data:
  backend_uploads:
